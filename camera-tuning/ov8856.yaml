# SPDX-License-Identifier: CC0-1.0
#
# Xiaomi nabu AAC OV8856 front-camera tuning for libcamera's simple IPA.
# The CCMs were recovered from the BPS cc13 block in
# com.qti.tuned.nabu_aac_ov8856_front.bin
# (SHA256 5aa3e22bff5ec3381127a9590586c0f529204eeaa05a452e5b3d2cf9288bdf13).
# Qualcomm's original CCT transition intervals are preserved by duplicating
# the middle matrix at 3600 K and 5500 K.
# The Ccm matrices recovered from Qualcomm's tuning blobs are currently NOT
# listed: with the conjugation bug fixed (patches/libcamera-0.5-debayer-ccm-swap.patch)
# the front matrix is neutral on grey but adds ~9% green to faces, and the rear
# one renders a strong green cast even on a neutral wall, because the simple
# IPA's AWB is untuned grey-world (it neutralises a face-dominated frame, and
# the CCM amplifies the residual).  Colours are AWB-only until the vendor AWB
# gains are extracted from the Chromatix blob and the Awb algorithm grows a
# colour-gain table.  See camera-tuning/README.md.
%YAML 1.1
---
version: 1
algorithms:
  - BlackLevel:
      blackLevel: 1024
  - Awb:
  - Lut:
  - Agc:
...
